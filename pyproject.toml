[project]
name = "home-credit-default"
version = "0.1.0"
description = "Probability of default on Home Credit applications"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "ruff>=0.16.8",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "nbconvert>=7.16",
    "nbstripout>=0.9.1",
]
